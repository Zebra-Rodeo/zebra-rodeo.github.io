---
layout: default
title: Zebra Rodeo
---
<style>
  .accueil{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2.5rem;padding-block:clamp(2rem,8vw,5rem)}
  .accueil img{width:min(220px,55vw);height:auto;display:block;filter:var(--logo-filtre)}
  .accueil p{max-width:30rem;color:var(--encre-douce);font-size:1rem;line-height:1.75}
  .billets{width:100%;max-width:36rem;margin:0 auto;border-top:1px solid var(--trait)}
  .billets a{display:block;padding-block:1.4rem;border-bottom:1px solid var(--trait)}
  .billets .date{display:block;font-family:var(--data);font-size:.6875rem;letter-spacing:.12em;text-transform:uppercase;color:var(--encre-douce)}
  .billets .titre{display:block;font-family:var(--titre);font-weight:600;font-size:1.25rem;line-height:1.3;margin-top:.3rem;text-wrap:balance;transition:color .15s}
  .billets a:hover .titre{color:var(--laiton)}
</style>

<div class="accueil">
  <img src="/zebra_rodeo_light.png" alt="Zebra Rodeo">
  <p>Notes from building things, by Arnaud Aubry.</p>
</div>

{% if site.posts.size > 0 %}
<nav class="billets">
  {% for post in site.posts %}
  <a href="{{ post.url }}">
    <span class="date">{% if post.date_display %}{{ post.date_display }}{% else %}{{ post.date | date: "%B %d, %Y" }}{% endif %}</span>
    <span class="titre">{{ post.title }}</span>
  </a>
  {% endfor %}
</nav>
{% endif %}
