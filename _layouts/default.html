<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/favicon/site.webmanifest">
  {% seo %}
  <style>
    /* Papier chaud par defaut, et l'identite sombre du site quand le lecteur
       la demande. Toutes les couleurs passent par ces jetons : aucune valeur
       litterale dans les regles de composants, sinon un theme se casse. */
    :root{
      --papier:#faf7f2;
      --encre:#262a2c;
      --encre-douce:#5c666a;
      --laiton:#8a5f14;
      --surface:#f2ede4;
      --trait:#e5dfd4;
      --bande:#11302b;
      --bande-encre:#edf1ea;
      --bande-douce:#9db3a9;
      --bande-accent:#d8a94e;
      --sable:#f0e5d4;
      --sable-encre:#3b3024;
      --logo-filtre:invert(1) brightness(.22);
      --titre:"Zilla Slab",Georgia,serif;
      --corps:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
      --data:"IBM Plex Mono",SFMono-Regular,Menlo,monospace;
      color-scheme:light;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --papier:#3c3e3b;
        --encre:#f1eee7;
        --encre-douce:#a9a79f;
        --laiton:#dcb15c;
        --surface:#353733;
        --trait:#4e514c;
        --bande:#17322d;
        --bande-encre:#edf1ea;
        --bande-douce:#9db3a9;
        --bande-accent:#d8a94e;
        --sable:#45392c;
        --sable-encre:#f2e7d6;
        --logo-filtre:none;
        color-scheme:dark;
      }
    }

    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

    body{
      background:var(--papier);
      color:var(--encre);
      font-family:var(--corps);
      font-size:1.0625rem;
      line-height:1.7;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      -webkit-font-smoothing:antialiased;
    }

    a{color:inherit;text-decoration:none}
    a:focus-visible{outline:2px solid var(--laiton);outline-offset:3px;border-radius:2px}

    .gouttiere{
      padding-left:max(1.5rem, env(safe-area-inset-left, 0px));
      padding-right:max(1.5rem, env(safe-area-inset-right, 0px));
    }

    header{
      width:100%;
      max-width:58rem;
      margin-inline:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:1.5rem;
      padding-block:1.75rem;
    }
    header .logo img{
      height:26px;
      width:auto;
      display:block;
      filter:var(--logo-filtre);
    }
    header nav a{
      font-family:var(--data);
      font-size:.6875rem;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--encre-douce);
      transition:color .15s;
    }
    header nav a:hover{color:var(--laiton)}

    /* La colonne n'est plus portee par main : chaque bloc se contraint
       lui-meme, ce qui laisse les bandes de couleur aller d'un bord a
       l'autre sans recourir aux unites de fenetre et a leur barre de
       defilement. */
    main{flex:1;width:100%}
    .colonne{
      max-width:39rem;
      margin-inline:auto;
      padding-inline:max(1.5rem, env(safe-area-inset-left, 0px));
    }

    footer{
      width:100%;
      max-width:58rem;
      margin-inline:auto;
      border-top:1px solid var(--trait);
      padding-block:2.25rem;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:2.5rem;
      flex-wrap:wrap;
    }
    footer a{
      font-family:var(--data);
      font-size:.6875rem;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--encre-douce);
      transition:color .15s;
    }
    footer a:hover{color:var(--laiton)}
  </style>
</head>
<body>

  <header class="gouttiere">
    <a class="logo" href="/" aria-label="Zebra Rodeo">
      <img src="/zebra_rodeo_light.png" alt="Zebra Rodeo">
    </a>
    <nav>
      <a href="/">Blog</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="gouttiere">
    <a href="/privacy-policy/">Privacy</a>
    <a href="/terms-of-service/">Terms</a>
  </footer>

</body>
</html>
